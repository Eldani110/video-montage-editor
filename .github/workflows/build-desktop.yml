name: Compilar Instaladores Desktop (Linux, Windows, macOS)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Compilar para ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar dependencias del sistema en Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libarchive-tools libopenjp2-7

      - name: Instalar dependencias npm
        run: npm ci

      - name: Compilar frontend Vite
        run: npm run build

      - name: Empaquetar instaladores (Linux)
        if: runner.os == 'Linux'
        run: npx electron-builder --linux deb AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Empaquetar instalador (Windows)
        if: runner.os == 'Windows'
        run: npx electron-builder --win nsis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Empaquetar instalador (macOS)
        if: runner.os == 'macOS'
        run: npx electron-builder --mac dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Subir instaladores como artefactos de GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: release/*.*
          if-no-files-found: warn

      - name: Publicar en GitHub Release (si es tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.*
            release/*.yml
            release/*.blockmap
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

