name: Compilar y Publicar Instaladores Desktop (Linux, Windows, macOS)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Compilar y Publicar para ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar dependencias del sistema en Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libarchive-tools libopenjp2-7

      - name: Instalar dependencias npm
        run: npm ci

      - name: Compilar frontend Vite
        run: npm run build

      - name: Empaquetar y Publicar en GitHub Releases (Linux)
        if: runner.os == 'Linux'
        run: npx electron-builder --linux deb AppImage --publish always
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Empaquetar y Publicar en GitHub Releases (Windows)
        if: runner.os == 'Windows'
        run: npx electron-builder --win nsis --publish always
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Empaquetar y Publicar en GitHub Releases (macOS)
        if: runner.os == 'macOS'
        run: npx electron-builder --mac dmg --publish always
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
