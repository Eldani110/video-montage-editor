version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: video-montage-editor
    restart: unless-stopped
    # Sin puertos publicados al host: el tráfico entra por nginx-proxy-manager
    # (80/443) a través de la red interna npm_net -> video-montage-editor:4173
    environment:
      NODE_ENV: production
    volumes:
      # Persiste los videos B-roll descargados entre reinicios/redeploys
      - ./projects_media:/app/projects_media
    networks:
      - npm_net

networks:
  npm_net:
    external: true
